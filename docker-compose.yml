services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8000"
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN},https://www.${SITE_DOMAIN}
      MAX_ACTIVE_PIPELINES: "1"
      MAX_UPLOAD_BYTES: "104857600"
      MAX_EXTRACTED_BYTES: "536870912"
      MAX_DEG_CSV_BYTES: "26214400"
      MAX_JOBS_PER_IP_PER_HOUR: "10"
      JOB_RETENTION_HOURS: "24"
    volumes:
      - uploads:/data/uploads
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        REACT_APP_API_URL: https://api.${SITE_DOMAIN:?Set SITE_DOMAIN}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  uploads:
  caddy-data:
  caddy-config:
