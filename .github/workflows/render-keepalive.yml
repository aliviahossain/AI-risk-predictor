name: Keep Render free service warm

on:
  schedule:
    # Render Free services spin down after 15 minutes without inbound traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render URL is configured
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Set the repository variable RENDER_SERVICE_URL to your Render service URL."
            exit 1
          fi
      - name: Request the health endpoint
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          service_url="${RENDER_SERVICE_URL%/}"
          curl --fail --silent --show-error --max-time 130 "$service_url/health"
