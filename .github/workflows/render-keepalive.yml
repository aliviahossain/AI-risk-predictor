name: Keep Render free service warm

on:
  push:
    branches: [main]
  schedule:
    # Offset minutes avoid GitHub's :00/:10 queue spikes while staying under Render's 15-min spin-down
    - cron: "4,18,32,46 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render URL is configured
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Set the repository variable RENDER_SERVICE_URL to your Render service URL."
            exit 1
          fi

      - name: Request the health endpoint
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          service_url="${RENDER_SERVICE_URL%/}"
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "$service_url/health"
