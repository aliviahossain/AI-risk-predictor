services:
  - type: web
    name: ai-risk-predictor-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_ACTIVE_PIPELINES
        value: "1"
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
      - key: MAX_EXTRACTED_BYTES
        value: "536870912"
      - key: MAX_DEG_CSV_BYTES
        value: "26214400"
      - key: MAX_JOBS_PER_IP_PER_HOUR
        value: "5"
      - key: JOB_RETENTION_HOURS
        value: "24"
